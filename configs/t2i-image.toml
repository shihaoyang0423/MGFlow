domain = "t2i"
objective = "kl"
model = "black-forest-labs/FLUX.2-klein-4B"
components = [1, 4]
reference = "assets/Reference/T2I/COCO-image"
encoder_weights_dir = "assets/Encoders/encoders"
output = "runs/t2i-image"
prompts = "assets/T2I/metadata.jsonl"
joint = false
encoder_weights = [0.3812140965816194, 0.7212338949798477, 0.10227115931908663]
ridges = [0.02, 0.0005, 0.02]
encoder_bf16 = false
global_batch = 1024
micro_batch = 4
encoder_micro_batch = 8
warmup_samples = 50000
steps = 1000
lr = 0.000005
lr_warmup = 150
lr_schedule = "constant"
adam_epsilon = 0.00000001
grad_clip = 4.0
ema_beta = 0.99
ema_beta_final = 0.99
save_every = 50
